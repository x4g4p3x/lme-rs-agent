[package]
name = "lme-rs-agent"
version = "0.2.1"
edition = "2021"
authors = ["Martin Huck <x4g4p3x@users.noreply.github.com>"]
description = "Protocol-neutral agent API for lme-rs mixed-effects models"
license = "MIT"
repository = "https://github.com/x4g4p3x/lme-rs-agent"
readme = "README.md"
keywords = ["mixed-effects", "lme4", "statistics", "agents"]
categories = ["science", "mathematics"]

[dependencies]
anyhow = "1"
lme-rs = "=0.2.7"
polars = { version = "0.46.0", features = ["csv"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_json = "1"

[profile.test]
inherits = "dev"
opt-level = 2
